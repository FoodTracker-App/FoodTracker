name: FoodTracker CI

on:
  push:
    branches:
      - master
      - backend
      - frontend
      - devops/setup-infrastructure
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build Docker image
        run: docker build -t foodtracker-backend:ci ./backend

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=foodtracker
          POSTGRES_USER=foodtracker
          POSTGRES_PASSWORD=ci-password
          JWT_ACCESS_SECRET=ci-only-secret
          CLIENT_ORIGIN=http://localhost:5173
          EOF

      - name: Start application stack
        run: docker compose up -d --build

      - name: Check running containers
        run: docker compose ps

      - name: Test backend health
        run: |
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")

            if [ "$status" = "200" ]; then
              echo "Backend health check passed."
              exit 0
            fi

            echo "Backend health check returned status: $status. Retrying..."
            sleep 5
          done
          echo "Backend health check failed"
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop application stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
