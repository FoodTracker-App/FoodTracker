name: FoodTracker CI

on:
  push:
    branches:
      - main
      - backend
      - frontend
      - devops/setup-infrastructure
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build Docker image
        run: docker build -t foodtracker-backend:ci ./backend

      - name: Start application stack
        run: docker compose up -d --build

      - name: Check running containers
        run: docker compose ps

      - name: Test backend API
        run: |
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/products)

            if [ "$status" = "401" ]; then
              echo "Backend API is reachable and authentication middleware is working."
              exit 0
            fi

            sleep 5
          done

          echo "Backend API did not become available"
          docker compose logs
          exit 1

      - name: Stop application stack
        if: always()
        run: docker compose down -v
